<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Merki Construction</title>
<style>
  :root{
    --header-h: 76px;
    --logo-w-center: min(300px, 55vw);
    --logo-w-header: 120px;
    /* Watermark blur patch (bottom-right by default). Adjust to match the video. */
    --wm-w: 190px;
    --wm-h: 64px;
    --wm-right: 0px;
    --wm-bottom: 0px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}

  /* ---------- Hero video (only content) ---------- */
  .hero{position:fixed;inset:0;background:#000}
  .hero video{width:100%;height:100%;object-fit:cover;display:block}

  /* Blur over the video watermark */
  .wm-blur{
    position:absolute;right:var(--wm-right);bottom:var(--wm-bottom);
    width:var(--wm-w);height:var(--wm-h);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    background:rgba(0,0,0,.15);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 55%,transparent 100%);
            mask-image:radial-gradient(ellipse at center,#000 55%,transparent 100%);
    pointer-events:none;
  }

  /* ---------- Glassmorphism header ---------- */
  .header{
    position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:20;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid rgba(255,255,255,.18);
    box-shadow:0 8px 32px rgba(0,0,0,.25);
    opacity:0;transform:translateY(-100%);
    transition:opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1);
  }
  body.ready .header{opacity:1;transform:none}

  /* ---------- Intro black screen ---------- */
  .intro{
    position:fixed;inset:0;z-index:30;background:#000;
    background:radial-gradient(circle at center,#161616 0%,#000 65%);
    transition:opacity 1.1s ease .2s;
  }
  body.ready .intro{opacity:0;pointer-events:none}

  /* subtle light sweep behind logo */
  .intro::after{
    content:"";position:absolute;left:50%;top:50%;width:520px;height:520px;
    transform:translate(-50%,-50%) scale(.4);border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);
    opacity:0;animation:glow 2s ease-out .2s forwards;
  }
  @keyframes glow{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
                  40%{opacity:1}
                  100%{opacity:.0;transform:translate(-50%,-50%) scale(1.4)}}

  /* ---------- The logo (single element, flies center -> header) ---------- */
  .logo{
    position:fixed;z-index:40;
    left:50%;top:50%;
    width:var(--logo-w-center);
    transform:translate(-50%,-50%) scale(.6);
    opacity:0;filter:blur(14px) drop-shadow(0 0 0 rgba(255,255,255,0));
    animation:pop 1.2s cubic-bezier(.2,1.2,.3,1) .3s forwards;
    transition:
      left 1.2s cubic-bezier(.7,0,.2,1),
      top 1.2s cubic-bezier(.7,0,.2,1),
      width 1.2s cubic-bezier(.7,0,.2,1),
      transform 1.2s cubic-bezier(.7,0,.2,1);
  }
  .logo img{width:100%;display:block}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.6);filter:blur(14px)}
    60%{opacity:1;transform:translate(-50%,-50%) scale(1.06);filter:blur(0) drop-shadow(0 0 28px rgba(255,255,255,.45))}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0) drop-shadow(0 0 18px rgba(255,255,255,.25))}
  }
  body.ready .logo{
    left:28px;top:calc(var(--header-h) / 2);
    width:var(--logo-w-header);
    transform:translate(0,-50%) scale(1);
    animation:none;opacity:1;filter:none;
  }

  html,body{height:100dvh;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  .hero{height:100dvh}
  .hero video{object-position:center}
  .hero video.bg{display:none;position:absolute;inset:0}
  /* ---------- Footer + glass enquiry button ---------- */
  .footer{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    display:flex;flex-direction:column-reverse;align-items:center;justify-content:center;gap:12px;text-align:center;
    padding:14px 28px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(0,0,0,.65),transparent);
    color:rgba(255,255,255,.85);font-size:14px;letter-spacing:.03em;
    opacity:0;transform:translateY(20px);
    transition:opacity .9s ease .6s, transform .9s ease .6s;
  }
  body.ready .footer{opacity:1;transform:none}
  /* ---------- Hanging enquiry button ---------- */
  #thread{position:fixed;inset:0;width:100%;height:100%;z-index:21;pointer-events:none;overflow:visible}
  #thread path{fill:none;stroke:rgba(200,225,255,.85);stroke-width:1.3;stroke-linecap:round;
    filter:drop-shadow(0 0 3px rgba(140,190,255,.9)) drop-shadow(0 0 8px rgba(100,160,255,.6))}
  #hang{position:fixed;left:0;top:0;width:0;height:0;z-index:22;will-change:transform}
  #hanger-vis{opacity:0;transition:opacity .5s ease}
  #hanger-vis.show{opacity:1}
  .enquiry{
    position:absolute;left:0;top:0;transform:translateX(-50%);white-space:nowrap;
    display:inline-flex;align-items:center;
    padding:12px 32px;border-radius:999px;text-decoration:none;
    color:#fff;font-weight:700;font-size:16px;letter-spacing:.03em;
    background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.10));
    backdrop-filter:blur(14px) saturate(150%);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    border:1.5px solid rgba(255,255,255,.6);
    text-shadow:0 1px 6px rgba(0,0,0,.45);
    box-shadow:0 8px 28px rgba(0,0,0,.45), 0 0 18px rgba(130,190,255,.45), inset 0 1px 0 rgba(255,255,255,.5);
    transition:background .25s, box-shadow .25s, translate .25s;
    touch-action:manipulation;
  }
  .enquiry:hover,.enquiry:focus-visible{
    background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.18));translate:0 -2px;outline:none;
    box-shadow:0 10px 32px rgba(0,0,0,.45),0 0 22px rgba(120,180,255,.55), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .spark{position:fixed;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;z-index:23;pointer-events:none;
    background:#d8ebff;box-shadow:0 0 8px 2px rgba(130,190,255,.9);
    animation:spark .8s ease-out forwards}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

  @media (max-width:600px){
    /* Portrait phones: blurred copy of the video fills the screen (no black),
       sharp video sits in the middle sized so its text is fully visible. */
    .hero video.bg{display:block;object-fit:cover;filter:blur(26px) brightness(.75);transform:scale(1.25)}
    .hero video.main{
      position:absolute;left:50%;top:50%;width:175vw;height:auto;aspect-ratio:16/9;
      transform:translate(-50%,-50%);object-fit:cover;
      -webkit-mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);
              mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);
    }
    .footer{padding:12px 16px calc(16px + env(safe-area-inset-bottom));font-size:12px}
    :root{--header-h:60px;--logo-w-center:min(230px,62vw);--logo-w-header:84px}
    body.ready .logo{
      left:calc(16px + env(safe-area-inset-left));
      top:calc(var(--header-h) / 2 + env(safe-area-inset-top));
    }
  }
  @media (max-height:480px) and (orientation:landscape){
    :root{--header-h:52px;--logo-w-center:180px;--logo-w-header:72px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01s!important;transition-duration:.01s!important}
  }
</style>
</head>
<body>

  <section class="hero">
    <video class="bg" src="59f33a7e0dd041fe995b3014a7f73d5c.mp4"
           autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid" class="main" src="59f33a7e0dd041fe995b3014a7f73d5c.mp4"
           autoplay muted loop playsinline preload="auto"></video>
  </section>

  <footer class="footer">
    <span>&copy; 2026 Merki Construction. Website under construction.</span>
  </footer>

  <div id="hanger-vis">
    <svg id="thread" aria-hidden="true"><path id="threadPath" d=""/></svg>
    <div id="hang">
      <a class="enquiry" id="enquiry" href="https://wa.me/918122512223?text=Hi%20Merki%2C%20I%20would%20like%20to%20enquire%20about%20your%20services."
         target="_blank" rel="noopener">Enquiry</a>
    </div>
  </div>

  <div class="intro"></div>

  <div class="logo">
    <img src="the merki logo-white.png.png" alt="Merki Construction">
  </div>

<script>
  const v = document.getElementById('vid');
  const bg = document.querySelector('video.bg');
  v.play().catch(()=>{}); bg.play().catch(()=>{});
  // keep the blurred background copy in sync with the main video
  setInterval(()=>{ if (Math.abs(bg.currentTime - v.currentTime) > 0.3) bg.currentTime = v.currentTime; }, 1000);
  // Hold the logo in the center, then fly it to the header and reveal the video.
  setTimeout(()=>document.body.classList.add('ready'), 2600);

  /* ---------- Hanging Enquiry button ----------
     The headline "Ours is next." is burned into the video, so the anchor points are
     the bottoms of the letters O, i, t measured in the 1920x1080 video frame. */
  (function(){
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const vis = document.getElementById('hanger-vis');
    const hang = document.getElementById('hang');
    const btn  = document.getElementById('enquiry');
    const path = document.getElementById('threadPath');
    const VW=1920, VH=1080;
    const LETTER_X=[617, 921.5, 1293.5];   // O, i, t centres (video px)
    const BASE_Y=316;                      // just under the headline baseline

    const MAX_HOVERS = 3;                  // clickable only after this many dodges
    let hovers = reduce ? MAX_HOVERS : 0, pos = reduce ? 2 : 0;
    let lastDodge = 0, lastMove = performance.now(), arrived = true, init = false;
    let px=0, py=0, vx=0, vy=0, th=0, om=0, last=performance.now();

    function geom(){
      const r=v.getBoundingClientRect();
      const s=Math.max(r.width/VW, r.height/VH);
      return {s, ox:r.left+(r.width-VW*s)/2, oy:r.top+(r.height-VH*s)/2};
    }
    function spark(x,y){
      for(let i=0;i<10;i++){
        const e=document.createElement('i'); e.className='spark';
        const a=Math.random()*6.283, d=14+Math.random()*26;
        e.style.left=x+'px'; e.style.top=y+'px';
        e.style.setProperty('--dx',Math.cos(a)*d+'px'); e.style.setProperty('--dy',Math.sin(a)*d+'px');
        document.body.appendChild(e); setTimeout(()=>e.remove(),850);
      }
    }
    function hop(){ pos=(pos+1)%LETTER_X.length; lastMove=performance.now(); arrived=false; }
    function dodge(){ hovers++; lastDodge=performance.now(); hop(); }
    // not locked yet -> keep roaming between the letters on its own
    setInterval(()=>{
      if(hovers>=MAX_HOVERS || reduce || document.hidden) return;
      if(performance.now()-lastMove>3800) hop();
    }, 500);

    document.addEventListener('pointermove', e=>{
      if(hovers>=MAX_HOVERS || reduce || e.pointerType!=='mouse' || performance.now()-lastDodge<900) return;
      const r=btn.getBoundingClientRect(), m=40;
      if(e.clientX>r.left-m && e.clientX<r.right+m && e.clientY>r.top-m && e.clientY<r.bottom+m) dodge();
    });
    btn.addEventListener('click', e=>{
      // detail===0 -> keyboard (Enter/Space): always allowed
      if(hovers<MAX_HOVERS && !reduce && e.detail!==0){ e.preventDefault(); dodge(); }
    });

    function frame(now){
      const dt=Math.min(.033,(now-last)/1000)||.016; last=now;
      const g=geom(), L=Math.max(52,Math.min(130,120*g.s));
      const tx=g.ox+LETTER_X[pos]*g.s, ty=g.oy+BASE_Y*g.s;
      let ax=0;
      if(!init || reduce){ px=tx; py=ty; vx=vy=0; init=true; }
      else{
        const K=70, C=9;                       // underdamped spring -> overshoot
        const oldvx=vx;
        vx+=(K*(tx-px)-C*vx)*dt; vy+=(K*(ty-py)-C*vy)*dt;
        px+=vx*dt; py+=vy*dt;
        ax=(vx-oldvx)/dt;
      }
      if(!reduce){
        const G=1800, D=2.4, MAXA=.55;
        ax=Math.max(-3000,Math.min(3000,ax))*.35;      // soften the push from the moving anchor
        om+=(-(G/L)*Math.sin(th)-(ax/L)*Math.cos(th)-D*om)*dt;
        th+=om*dt;
        if(th>MAXA){th=MAXA;om=Math.min(om,0);} else if(th<-MAXA){th=-MAXA;om=Math.max(om,0);}  // don't stick at the limit
      }
      const idle=reduce?0:(3*Math.PI/180)*Math.sin(now/1000*2*Math.PI/3.5);
      const a=th+idle;
      const bx=px+L*Math.sin(a), by=py+L*Math.cos(a);
      // thread: slight sag, more while the anchor is moving
      const sp=Math.hypot(vx,vy);
      const cx=(px+bx)/2-Math.max(-40,Math.min(40,vx*.05)), cy=(py+by)/2+5+Math.min(25,sp*.04);
      path.setAttribute('d',`M${px.toFixed(1)} ${py.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`);
      hang.style.transform=`translate(${bx.toFixed(1)}px,${by.toFixed(1)}px) rotate(${a}rad)`;
      if(!arrived && Math.hypot(tx-px,ty-py)<4 && init){ arrived=true; spark(px,py); }
      // hide while the headline animates in at the start of each video loop
      vis.classList.toggle('show', document.body.classList.contains('ready') && v.currentTime>1.4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
